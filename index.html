<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keziah's Math Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Keziah's Math Game</h1>
    <p class="tagline">Multiply by popping bubbles together!</p>
  </header>

  <section id="setup" class="card">
    <form id="problem-form" autocomplete="off">
      <input id="num-a" type="number" min="1" max="9999" inputmode="numeric" placeholder="14" required aria-label="Number in each bubble">
      <span class="op">×</span>
      <input id="num-b" type="number" min="1" max="40" inputmode="numeric" placeholder="12" required aria-label="How many bubbles">
      <button type="submit" class="primary">Make bubbles!</button>
    </form>
    <p class="hint">The first number goes in every bubble. The second number is how many bubbles you get (up to 40).</p>
    <p id="error" class="error" role="alert"></p>
  </section>

  <section id="game" class="hidden">
    <div class="status card">
      <div id="problem-label" class="problem-label"></div>
      <div id="progress" class="progress"></div>
      <button id="new-btn" type="button">New problem</button>
    </div>
    <p class="hint drag-hint">Drag one bubble onto another to add them together.</p>
    <div id="play-area"></div>
    <ul id="history" aria-label="Your additions"></ul>
  </section>

  <div id="win" class="hidden" role="dialog" aria-live="polite">
    <div class="win-card">
      <div class="win-title">You did it! 🎉</div>
      <div id="win-equation" class="win-equation"></div>
      <button id="again-btn" type="button" class="primary">Play again</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
